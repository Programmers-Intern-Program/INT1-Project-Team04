spring:
  application:
    name: back
  profiles:
    default: dev
  # I/O 바운드(LLM·외부 API) 작업을 가상 스레드로 처리 — 플랫폼 스레드 풀 고갈 없이 대량 동시 호출.
  # (SpringAiMonitorAdapter 가 이미 수동 가상 스레드를 쓰지만, web/scheduler/@Async 레이어도 일관되게 적용)
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      # 가상 스레드로 동시성이 올라가면 기본값 10 으로는 커넥션 고갈 → 환경별 override 가능
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # 알림 발송·스케줄 갱신 등 다건 INSERT/UPDATE 를 배치로 묶어 round-trip 절감
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 30
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    # 마이그레이션은 환경 무관해야 하므로 ${...} 치환 비활성화.
    placeholder-replacement: false

  ai:
    mcp:
      client:
        request-timeout: ${MCP_CLIENT_REQUEST_TIMEOUT:60s}
        sse:
          connections:
            python-mcp:
              url: ${MCP_SERVER_URL:http://localhost:8090}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  auth:
    session-cookie-name: ${APP_AUTH_SESSION_COOKIE_NAME:SESSION}
    state-cookie-name: ${APP_AUTH_STATE_COOKIE_NAME:OAUTH_STATE}
    session-days: ${APP_AUTH_SESSION_DAYS:14}
    secure-cookies: ${APP_AUTH_SECURE_COOKIES:false}
  oauth:
    kakao:
      client-id: ${APP_OAUTH_KAKAO_CLIENT_ID:}
      client-secret: ${APP_OAUTH_KAKAO_CLIENT_SECRET:}
      redirect-uri: ${APP_OAUTH_KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/oauth/kakao/callback}
    google:
      client-id: ${APP_OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${APP_OAUTH_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${APP_OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth/google/callback}
    discord:
      client-id: ${APP_OAUTH_DISCORD_CLIENT_ID:}
      client-secret: ${APP_OAUTH_DISCORD_CLIENT_SECRET:}
      redirect-uri: ${APP_OAUTH_DISCORD_REDIRECT_URI:http://localhost:8080/api/auth/oauth/discord/callback}
  notification:
    max-attempts: ${APP_NOTIFICATION_MAX_ATTEMPTS:3}
    retry-delay-seconds: ${APP_NOTIFICATION_RETRY_DELAY_SECONDS:300}
    dispatch-concurrency-limit: ${APP_NOTIFICATION_DISPATCH_CONCURRENCY_LIMIT:20}
    telegram:
      bot-username: ${APP_NOTIFICATION_TELEGRAM_BOT_USERNAME:}
    baseline-promote:
      # 알림 메시지에 포함되는 GET 링크의 base URL (사용자가 직접 클릭).
      # 외부 노출 도메인이 백엔드 8080 과 다를 수 있으므로 별도 prop.
      base-url: ${APP_BASELINE_PROMOTE_BASE_URL:http://localhost:8080}
      ttl-days: ${APP_BASELINE_PROMOTE_TTL_DAYS:7}
  monitor:
    concurrency-limit: ${APP_MONITOR_CONCURRENCY_LIMIT:5}

# [미사용] GlmTaskParserAdapter 전용 설정 — @Profile("glm") 비활성화로 현재 사용되지 않음.
# VertexAiTaskParserAdapter로 전환되었으며, 모델 옵션은 아래 경로에서 관리한다:
#   application-dev.yml  → spring.ai.vertex.ai.gemini.chat.options.model
#   application-prod.yml → spring.ai.vertex.ai.gemini.chat.options.model
# GLM API 인증 이슈로 인해 Vertex AI(Gemini)로 전환 결정 (2025-04).
ai-gateway:
  base-url: ${AI_BASE_URL:${AI_PARSER_BASE_URL:}}
  api-key: ${AI_API_KEY:${AI_PARSER_API_KEY:}}
  model: ${AI_MODEL:${AI_PARSER_MODEL:glm-4.5}}
  max-tokens: ${AI_MAX_TOKENS:${AI_PARSER_MAX_TOKENS:2048}}
  temperature: ${AI_TEMPERATURE:${AI_PARSER_TEMPERATURE:0.3}}
